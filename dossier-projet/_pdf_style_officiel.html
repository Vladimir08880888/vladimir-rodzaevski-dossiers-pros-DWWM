<style>
  @page { margin: 2.1cm 1.8cm 1.8cm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #2b2520;
    font-size: 10.3pt;
    line-height: 1.55;
    max-width: 100%;
  }

  .pagebreak { page-break-after: always; }

    position: absolute;
    top: -20px; right: -36px;
    width: 130px; height: 34px;
    background: linear-gradient(135deg, #c3553a 0%, #8b2c14 100%);
    transform: rotate(45deg);
  }
  .logo-mark{ display:flex; flex-direction:column; gap:5px; margin-bottom: 1.6cm; }
  .logo-mark .bar{ height: 9px; border-radius: 4px; background: #c3553a; }
  .logo-mark .b1{ width: 46px; }
  .logo-mark .b2{ width: 78px; }
  .logo-mark .b3{ width: 60px; }

  .big-title{
    font-size: 40pt;
    font-weight: 800;
    color: #1a1612;
    margin: 3.4cm 0 0.05em;
    width: 100%;
    text-align: center;
  }
  .big-subtitle{
    text-align:center;
    font-size: 15pt;
    font-weight: 700;
    color: #c3553a;
    margin: 0 0 1.3cm;
    width: 100%;
  }
  .tp-subtitle{ text-align:center; color: #847261; font-size: 11pt; width:100%; margin: 0 0 1.6cm; line-height:1.6; }
  .tp-context{ text-align:center; color: #2b2520; font-size: 11pt; width:100%; margin: 0 0 1.8cm; line-height:1.7; }
  .tp-presente{ text-align:center; color: #847261; font-size: 11pt; width:100%; margin: 0 0 0.3em; }
  .tp-nom{ text-align:center; color: #1a1612; font-size: 14pt; font-weight: 800; width:100%; }

  /* ---- headings with colored drop letter ---- */
  h1{
    font-size: 21pt;
    font-weight: 800;
    color: #1a1612;
    text-align:center;
    margin: 0.3em 0 0.9em;
    page-break-after: avoid;
  }
  h1 .letter{ color: #c3553a; }
  h2{
    font-size: 13.5pt;
    font-weight: 800;
    color: #1a1612;
    margin-top: 1.5em;
    padding-bottom: 0.15em;
    border-bottom: 2px solid #f3e6d6;
    page-break-after: avoid;
  }
  h3{
    font-size: 11.5pt;
    font-weight: 800;
    color: #c3553a;
    margin-top: 1.2em;

  code{

    padding: 0.1em 0.34em;

    color: #8b2c14;
  }
  pre{
    background: #fbf8f1;

    padding: 0.75em 0.9em;

    line-height: 1.42;

    page-break-inside: avoid;
  }

  td{ padding: 6px 9px; border: 1px solid #e4d9c8; vertical-align: top; }

  ul, ol{ padding-left: 1.4em; }
  li{ margin: 0.18em 0; }

  .toc-row{ display:flex; align-items:baseline; gap: 0.4em; font-size: 10pt; margin: 0.55em 0; }

  table.mvp-table th{ background:#e3ecdc; color:#3f5230; }
  table.mvp-table tr:nth-child(even) td{ background: #f5f8f2; }
  table.futur-table th{ background: #f3e6d6; color: #8b2c14; }
  table.futur-table tr:nth-child(even) td{ background: #fbf3ea; }

  .diagram-img{ max-width: 100%; display:block; margin: 1em auto; border: 1px solid #e4d9c8; border-radius: 8px; }
  .shot-row{ display:flex; gap: 14px; margin: 0.8em 0 1.4em; page-break-inside: avoid; }

  .shot-mobile{ max-width: 220px; border: 1px solid #e4d9c8; border-radius: 14px; box-shadow: 0 4px 14px rgba(124,77,46,0.14); }
